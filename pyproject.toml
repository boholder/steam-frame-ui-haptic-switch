[project]
name = "steam-frame-ui-haptic-switch"
version = "0.1.0"
description = "A Steam Frame plugin that adds a Quick Settings switch to turn the controller's UI hover haptics on or off."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]
# Docs contain illustrative snippets; they are not formatter-governed code.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Pin the baseline explicitly: ruff >=0.16 expanded its default rule set,
# which would silently pull in UP/BLE/S/... beyond the curated list below.
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "PGH", # pygrep-hooks
    "RUF", # ruff
    "W", # pycodestyle
    "YTT", # flake8-2020
]
extend-ignore = ["B018", "B019", "RUF018"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["src"]
