name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.17.1"
          args: check --output-format=github
      - run: ruff format --check .

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install esprima
      - name: Run checks
        env:
          # ruff runs only in the dedicated job above; skip it here to avoid a second run.
          SKIP_RUFF: "1"
        run: bash scripts/check.sh
